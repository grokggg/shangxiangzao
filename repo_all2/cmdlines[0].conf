import requests, base64, pickle

url = 'http://127.0.0.1:20000/api/v1/invoke'

def build_invoke(import_path, *args, **kwargs):
    payload = base64.b64encode(pickle.dumps((args, kwargs))).decode('utf-8')
    return {
        'request_id': None, 'import_path': import_path, 'payload': payload,
        'payload_ref': None, 'venv_id': None, 'trace_context': None, 'request_timeout': None,
    }

