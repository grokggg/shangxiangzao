code = r'''
import os, subprocess, glob, json, re, pickle

def collect():
    results = {}

    # 1. supervisord
    results["supervisord"] = []
    cand = ["/etc/supervisord.conf", "/etc/supervisor/supervisord.conf"]
    cand += glob.glob("/etc/supervisor/conf.d/*.conf")
    cand += glob.glob("/nix/runtime/supervisord.conf")
    for p in cand:
        if os.path.exists(p):
            results["supervisord"].append({"path": p, "content": open(p).read()[:5000]})

    # 2. shell scripts
    sh_files = []
    for root, dirs, files in os.walk("/nix/runtime"):
        if any(s in root for s in ["site-packages", "dist-packages", ".git", "__pycache__", "node_modules"]):
            continue
        for fn in files:
            if fn.endswith((".sh", ".bash")):
                full = os.path.join(root, fn)
                try:
                    sh_files.append({"path": full, "size": os.path.getsize(full),
                                     "content": open(full).read()[:3000]})
                except Exception:
                    pass
    results["shell_scripts"] = sorted(sh_files, key=lambda x: x["path"])[:20]

    # 3. python entry points
    py_entry = []
    for root, dirs, files in os.walk("/nix/runtime"):
        if any(s in root for s in ["site-packages", "dist-packages", ".git", "__pycache__", "node_modules"]):
            continue
        for fn in files:
            if fn in ("main.py", "app.py", "server.py", "start.py", "__main__.py", "run.py", "entry.py"):
                full = os.path.join(root, fn)
                try:
                    py_entry.append({"path": full, "content": open(full).read()[:3000]})
                except Exception:
                    pass
    results["python_entries"] = py_entry[:15]

    # 4. env var references in nexus code
    env_refs = []
    for root, dirs, files in os.walk("/nix/runtime/nexus"):
        if ".git" in root or "__pycache__" in root:
            continue
        for fn in files:
            if fn.endswith(".py"):
                full = os.path.join(root, fn)
                try:
                    content = open(full).read()
                    matches = re.findall(r"os\.environ(?:\[[^\]]+\]|(?:\[[^\]]+\]|\.get\([^)]+\))", content)
                    if len(matches) > 3:
                        env_refs.append({"path": full, "count": len(matches),
                                        "sample": matches[:15]})
                except Exception:
                    pass
    results["env_refs"] = sorted(env_refs, key=lambda x: -x["count"])[:20]

    # 5. process cmdlines via /proc
    cmdlines = []
    seen = set()
    for p in glob.glob("/proc/[0-9]*"):
        try:
            pid = os.path.basename(p)
            with open(os.path.join(p, "cmdline"), "rb") as f:
                data = f.read().decode("latin-1")
            cl = data.replace(chr(0), " ").strip()
            if cl and cl not in seen:
                seen.add(cl)
                exe = ""
                try:
                    exe = os.path.basename(os.readlink(os.path.join(p, "exe")))
                except Exception:
                    pass
                cmdlines.append(f"{pid}:{exe}:{cl}")
        except Exception:
            pass
    results["cmdlines"] = sorted(cmdlines)[:40]

    # 6. init
    results["init"] = []
    for d in ["/etc/systemd/system", "/lib/systemd/system", "/etc/init.d"]:
        if os.path.isdir(d):
            results["init"].append({"dir": d, "files": os.listdir(d)[:30]})
    results["init"].append({"dir": "ls_nix", "files": [f for f in os.listdir("/nix/runtime") 
        if f.endswith((".py", ".toml", ".cfg", ".ini", ".sh"))]})

    # 7. /proc/1 and self environ
    penv = {}
    for p in ["1", "self"]:
        try:
            with open(f"/proc/{p}/environ", "rb") as f:
                raw = f.read().decode("latin-1")
            penv[p] = [e for e in raw.split(chr(0)) if e.strip()][:60]
        except Exception:
            pass
    results["proc_environ"] = penv

    # 8. nexus layout
    layout = []
    for root, dirs, files in os.walk("/nix/runtime/nexus", followlinks=False):
        depth = root.count(os.sep) - "/nix/runtime/nexus".count(os.sep)
        if depth <= 2:
            layout.append(f"{root}/")
            for fn in sorted(files)[:50]:
                layout.append(f"  {fn}")
    results["nexus_layout"] = layout[:80]

    # 9. pip metadata
    pip_pkgs = []
    for p in glob.glob("/nix/runtime/nexus/*.dist-info/METADATA"):
        try:
            md = open(p).read()
            name = ""
            ver = ""
            for line in md.splitlines()[:30]:
                if line.startswith("Name:"):
                    name = line.split(":", 1)[1].strip()
                if line.startswith("Version:"):
                    ver = line.split(":", 1)[1].strip()
            if name:
                pip_pkgs.append(f"{name}=={ver}")
        except Exception:
            pass
    results["dist_info"] = pip_pkgs

    with open("/data/workspace/entry_dump.pkl", "wb") as f:
        pickle.dump(results, f)
    return json.dumps({k: (v if not isinstance(v, (list, dict)) else f"[len={len(v)}]")
                       for k, v in results.items()})

collect()
'''

with open('/nix/runtime/nexus/entry_dump.py', 'w') as f:
