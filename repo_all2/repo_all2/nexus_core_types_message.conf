"""Extended message types for multi-provider compatibility."""

from __future__ import annotations

from typing import Any, cast

from openai.types.chat import ChatCompletionMessage
from openai.types.chat.chat_completion_message import Annotation, FunctionCall
from openai.types.chat.chat_completion_message_tool_call import ChatCompletionMessageToolCall
from pydantic import BaseModel


class ThinkingBlock(BaseModel):
    """Thinking block from Claude models."""

    type: str = 'thinking'
    thinking: str = ''
    signature: str | None = None


class RedactedThinkingBlock(BaseModel):
    """Redacted thinking block from Claude models."""

    type: str = 'redacted_thinking'
    data: str = ''


class ExtendedMessage(BaseModel):
    """Extended chat completion message with provider-specific fields.

    Compatible with OpenAI's ChatCompletionMessage but includes additional fields
    for multi-provider support (reasoning content, thinking blocks, etc.).
    """

    content: str | None = None
    """The contents of the message."""

    role: str = 'assistant'
    """The role of the author of this message."""

    refusal: str | None = None
    """The refusal message generated by the model."""

    tool_calls: list[ChatCompletionMessageToolCall] | None = None
    """The tool calls generated by the model, such as function calls."""

    raw_tool: str | None = None
    """The raw string content of the tool message."""

    function_call: FunctionCall | None = None
    """Deprecated and replaced by tool_calls."""

    annotations: list[Annotation] | None = None
    """Annotations for the message, when applicable."""

    name: str | None = None
    """An optional name for the participant."""

    # Extended fields for multi-provider support
    reasoning_content: str | None = None
    """Reasoning content from models like DeepSeek, o1, etc."""

    reasoning_items: list[dict[str, Any]] | None = None
    """Responses reasoning items, including opaque encrypted_content when available."""

    thinking_blocks: list[ThinkingBlock | RedactedThinkingBlock] | None = None
    """Thinking blocks from Claude models with extended thinking enabled."""

    provider_specific_fields: dict[str, Any] | None = None
    """Additional provider-specific fields not covered by standard fields."""

    raw_response: str | None = None
    """Raw response text before parsing (for reward calculation)."""

    @classmethod
    def from_openai(cls, message: ChatCompletionMessage) -> ExtendedMessage:
        """Create ExtendedMessage from OpenAI ChatCompletionMessage."""
        return cls(
            content=message.content,
            role=message.role,
            refusal=message.refusal,
            tool_calls=cast(list[ChatCompletionMessageToolCall], list(message.tool_calls))
            if message.tool_calls
            else None,
            function_call=message.function_call,
            annotations=list(message.annotations) if message.annotations else None,
            name=getattr(message, 'name', None),
            reasoning_content=getattr(message, 'reasoning_content', None),
            reasoning_items=getattr(message, 'reasoning_items', None),
            thinking_blocks=getattr(message, 'thinking_blocks', None),
            provider_specific_fields=getattr(message, 'provider_specific_fields', None),
            raw_tool=getattr(message, 'raw_tool', None),
            raw_response=getattr(message, 'raw_response', None),
        )
